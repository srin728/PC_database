name: Build and deploy bibliography

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check Python syntax
        run: python3 -m py_compile scripts/build.py scripts/validate.py scripts/audit_links.py

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate BibTeX data
        run: python3 scripts/validate.py

      - name: Audit paper links
        run: python3 scripts/audit_links.py

      - name: Check JavaScript syntax
        run: |
          node --check site/assets/search-engine.js
          node --check site/assets/app.js

      - name: Test optimized search engine
        run: node tests/search_engine_test.js

      - name: Build static site
        run: python3 scripts/build.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
